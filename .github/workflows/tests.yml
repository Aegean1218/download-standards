name: Helper tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            download-standards/scripts/requirements.txt
            download-standards/tests/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r download-standards/tests/requirements.txt
      - name: Run local fixture tests
        run: python -m unittest discover -s download-standards/tests -v
